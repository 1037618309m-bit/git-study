apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-rolebinding
subjects:
  - kind: ServiceAccount
    name: test-user
roleRef:
  kind: Role
  name: test-role
  apiGroup: rbac.authorization.k8s.io

